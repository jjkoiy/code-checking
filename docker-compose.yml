services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/app.db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LLM_PROVIDER: mock
      LLM_EXTERNAL_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  app_data:
  redis_data:
