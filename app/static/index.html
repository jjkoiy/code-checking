<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Review Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #1f2937;
      --muted: #667085;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
      --warning: #b54708;
      --ok: #027a48;
      --code: #111827;
      --soft: #eef6f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(1320px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--accent-dark);
      font-weight: 800;
      border: 1px solid #c6e1dd;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }

    .sub {
      margin: 1px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warning); }
    .dot.bad { background: var(--danger); }

    main {
      width: min(1320px, calc(100vw - 32px));
      margin: 18px auto 32px;
      display: grid;
      grid-template-columns: minmax(360px, 520px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .result-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .lang-btn {
      height: 26px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .lang-btn:hover {
      background: #eef2f6;
      color: var(--text);
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 750;
    }

    .body {
      padding: 16px;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid #cfd6e2;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input, select {
      height: 38px;
      padding: 0 10px;
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: var(--code);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid transparent;
      border-radius: 6px;
      height: 38px;
      padding: 0 13px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
    }

    button.secondary:hover {
      background: #f8fafc;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
      min-height: 72px;
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .merge-banner {
      display: grid;
      gap: 4px;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--muted);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .merge-banner strong {
      font-size: 14px;
    }

    .merge-banner span {
      color: var(--muted);
      font-size: 12px;
    }

    .merge-banner.block {
      border-left-color: var(--danger);
      background: #fff7f6;
    }

    .merge-banner.needs_review,
    .merge-banner.caution {
      border-left-color: var(--warning);
      background: #fffbf0;
    }

    .merge-banner.pass {
      border-left-color: var(--ok);
      background: #f0fdf4;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .high-risk {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .risk-item {
      border: 1px solid #fecdca;
      border-radius: 8px;
      padding: 10px;
      background: #fff7f6;
    }

    .risk-item strong {
      display: block;
      font-size: 13px;
    }

    .risk-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      padding: 0 12px;
      gap: 4px;
    }

    .tab {
      height: 40px;
      padding: 0 12px;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-radius: 0;
      border-bottom: 2px solid transparent;
    }

    .tab:hover {
      background: transparent;
      color: var(--text);
    }

    .tab.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }

    .panel {
      display: none;
      padding: 16px;
    }

    .panel.active {
      display: block;
    }

    .report {
      max-height: 640px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: var(--code);
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }

    .findings {
      display: grid;
      gap: 10px;
      max-height: 640px;
      overflow: auto;
    }

    .finding {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .finding-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .finding h3 {
      margin: 0;
      font-size: 14px;
    }

    .severity {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      background: #eef2f6;
      color: #344054;
      white-space: nowrap;
    }

    .severity.critical, .severity.high {
      background: #fef3f2;
      color: var(--danger);
    }

    .severity.medium {
      background: #fffaeb;
      color: var(--warning);
    }

    .severity.low {
      background: #ecfdf3;
      color: var(--ok);
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .finding p {
      margin: 10px 0 0;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #fbfcfe;
    }

    .toast {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid var(--line);
      color: var(--muted);
      min-height: 42px;
    }

    .toast.error {
      background: #fef3f2;
      border-color: #fecdca;
      color: var(--danger);
    }

    .toast.ok {
      background: #ecfdf3;
      border-color: #abefc6;
      color: var(--ok);
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid-2,
      .filters,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="mark">AR</div>
        <div>
          <h1>Agent Review Console</h1>
          <p class="sub">FastAPI / LangGraph / SQLAlchemy</p>
        </div>
      </div>
      <div class="status-pill" id="healthPill"><span class="dot" id="healthDot"></span><span id="healthText">checking</span></div>
    </div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>Review Input</h2>
      </div>
      <div class="body">
        <div class="grid-2">
          <div>
            <label for="repoName">Repo name</label>
            <input id="repoName" value="local-demo">
          </div>
          <div>
            <label for="sourceType">Source type</label>
            <input id="sourceType" value="ui">
          </div>
        </div>

        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" autocomplete="off" placeholder="Optional when API auth is disabled">

        <label for="diffText">Git diff</label>
        <textarea id="diffText" spellcheck="false"></textarea>

        <div class="actions">
          <button id="submitBtn" type="button">Run Review</button>
          <button id="sampleBtn" class="secondary" type="button">Load Sample</button>
          <button id="clearBtn" class="secondary" type="button">Clear</button>
        </div>

        <div class="toast" id="message">Ready.</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Review Result</h2>
        <div class="result-tools">
          <div class="lang-toggle" aria-label="Result language">
            <button class="lang-btn active" id="langEnBtn" type="button" data-lang="en">English</button>
            <button class="lang-btn" id="langZhBtn" type="button" data-lang="zh">中文</button>
          </div>
          <div class="status-pill"><span class="dot" id="taskDot"></span><span id="taskStatus">idle</span></div>
        </div>
      </div>
      <div class="body">
        <div class="merge-banner" id="mergeBanner">
          <strong id="mergeLabel">No recommendation yet</strong>
          <span id="mergeReason">Run a review to see the merge guidance.</span>
        </div>

        <div class="summary">
          <div class="metric"><strong id="totalCount">0</strong><span>Total</span></div>
          <div class="metric"><strong id="blockingCount">0</strong><span>Blocking</span></div>
          <div class="metric"><strong id="highCount">0</strong><span>High/Critical</span></div>
          <div class="metric"><strong id="testsCount">0</strong><span>Draft tests</span></div>
        </div>

        <div class="high-risk" id="highRiskList"></div>
      </div>

      <div class="tabs">
        <button class="tab active" type="button" data-tab="findingsPanel">Findings</button>
        <button class="tab" type="button" data-tab="markdownPanel">Markdown</button>
        <button class="tab" type="button" data-tab="jsonPanel">JSON</button>
      </div>

      <div class="panel active" id="findingsPanel">
        <div class="filters">
          <div>
            <label for="severityFilter">Severity</label>
            <select id="severityFilter">
              <option value="all">All severities</option>
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
              <option value="all">All categories</option>
            </select>
          </div>
          <div>
            <label for="fileFilter">File</label>
            <select id="fileFilter">
              <option value="all">All files</option>
            </select>
          </div>
          <div>
            <label for="blockingFilter">Status</label>
            <select id="blockingFilter">
              <option value="all">All statuses</option>
              <option value="blocking">Blocking only</option>
              <option value="non_blocking">Non-blocking</option>
            </select>
          </div>
        </div>
        <div class="empty" id="findingsEmpty">No findings yet.</div>
        <div class="findings" id="findingsList"></div>
      </div>
      <div class="panel" id="markdownPanel">
        <div class="report" id="markdownReport">No report yet.</div>
      </div>
      <div class="panel" id="jsonPanel">
        <pre class="report" id="jsonReport">No JSON yet.</pre>
      </div>
    </section>
  </main>

  <script>
    const sampleDiff = `diff --git a/app/demo.py b/app/demo.py
index 1111111..2222222 100644
--- a/app/demo.py
+++ b/app/demo.py
@@ -1,2 +1,7 @@
 def handler(user):
+    query = f"SELECT * FROM users WHERE name = '{user}'"
+    # TODO tighten auth
+    try:
+        pass
+    except Exception:
+        pass
     return user
`;

    const state = {
      taskId: null,
      pollTimer: null,
      resultLanguage: "en",
      latestReport: null,
      filters: {
        severity: "all",
        category: "all",
        file: "all",
        blocking: "all",
      },
    };

    const translations = {
      severity: {
        critical: "严重",
        high: "高危",
        medium: "中危",
        low: "低危",
      },
      category: {
        bug: "缺陷",
        security: "安全",
        maintainability: "可维护性",
        reliability: "可靠性",
        readability: "可读性",
        style: "代码风格",
        uncategorized: "未分类",
      },
      title: {
        "Authentication flow may need review": "需要检查认证流程",
        "Error handling should be reviewed for completeness": "需要检查错误处理是否完整",
        "Database session/transaction management should be verified": "需要确认数据库会话和事务管理",
        "API compatibility should be checked": "需要检查 API 兼容性",
        "Input validation should be comprehensive": "需要完善输入校验",
        "Potential SQL injection via f-string": "f-string 可能导致 SQL 注入",
        "Variable named query/sql assigned to f-string": "query/sql 变量使用了 f-string",
        "Hardcoded secret or credential": "硬编码密钥或凭据",
        "Potential command injection": "潜在命令注入",
        "Use of dangerous eval/exec": "使用危险的 eval/exec",
        "Insecure deserialization": "不安全的反序列化",
        "Weak hash algorithm": "弱哈希算法",
        "HTTP instead of HTTPS": "使用 HTTP 而不是 HTTPS",
        "Debug mode enabled": "开启了调试模式",
        "Bare except clause": "裸 except 捕获",
        "Empty except block": "空 except 代码块",
        "Mutable default argument": "可变默认参数",
        "Print statement in production path": "生产路径中使用 print",
        "SQL string concatenation / interpolation": "SQL 字符串拼接或插值",
        "Broad exception caught": "捕获范围过宽的异常",
        "Hardcoded absolute path": "硬编码绝对路径",
        "Open without context manager": "未使用上下文管理器打开文件",
        "Overly long line": "代码行过长",
        "Magic number used": "使用魔法数字",
        "Single-letter variable name": "单字母变量名",
        "TODO/FIXME left in code": "代码中遗留 TODO/FIXME",
        "Function appears too long": "函数可能过长",
      },
      text: {
        "Changes touch authentication-related code. Verify that auth checks are applied consistently across all affected endpoints.": "变更涉及认证相关代码。请确认所有受影响接口都一致地应用了认证检查。",
        "Ensure every protected endpoint has an auth dependency and that role checks are applied before business logic.": "确保每个受保护接口都有认证依赖，并且在业务逻辑前完成角色检查。",
        "Error handling patterns detected. Verify that exceptions are translated appropriately at API boundaries and that users get actionable error messages.": "检测到错误处理相关改动。请确认 API 边界能正确转换异常，并向用户返回可操作的错误信息。",
        "Map internal exceptions to appropriate HTTP status codes. Avoid leaking stack traces to API consumers.": "将内部异常映射为合适的 HTTP 状态码，避免向 API 使用者泄露堆栈信息。",
        "Database operations detected. Verify that sessions are properly closed and transactions are committed or rolled back on error.": "检测到数据库操作。请确认会话会正确关闭，事务在成功时提交、出错时回滚。",
        "Use context managers for DB sessions. Ensure rollback on exceptions and commit only on success.": "数据库会话建议使用上下文管理器。异常时回滚，只在成功时提交。",
        "Changes affect API surface. Verify backward compatibility and that request/response schemas haven't broken existing consumers.": "变更影响 API 表面。请确认向后兼容性，并检查请求/响应模型没有破坏现有调用方。",
        "Review all changed endpoints for backward compatibility. Consider API versioning if breaking changes are intentional.": "检查所有变更接口的向后兼容性。如果有意引入破坏性变更，请考虑 API 版本化。",
        "User input handling detected. Verify that all inputs are validated with appropriate Pydantic models or manual checks.": "检测到用户输入处理。请确认所有输入都通过合适的 Pydantic 模型或手动逻辑进行校验。",
        "Add Pydantic validators for business rules. Check for edge cases: empty strings, oversized inputs, unexpected types.": "为业务规则添加 Pydantic 校验器，并覆盖空字符串、超长输入、异常类型等边界情况。",
        "SQL query built with f-string interpolation allows SQL injection attacks.": "使用 f-string 拼接 SQL 查询会导致 SQL 注入风险。",
        "An attacker could inject malicious SQL via user-controlled input interpolated into the query string.": "攻击者可能通过被插入查询字符串的用户输入注入恶意 SQL。",
        "Use parameterized queries: SQLAlchemy text() with bindparams, psycopg2 %s placeholders, or an ORM.": "使用参数化查询，例如 SQLAlchemy text() + bindparams、psycopg2 %s 占位符，或 ORM。",
        "A variable named query/sql/cursor assigned to an f-string suggests dynamic SQL construction.": "名为 query/sql/cursor 的变量被赋值为 f-string，通常意味着正在动态构造 SQL。",
        "Dynamic SQL without proper parameterization is vulnerable to SQL injection.": "没有正确参数化的动态 SQL 容易受到 SQL 注入攻击。",
        "Use parameterized queries or an ORM. If dynamic table/column names are needed, validate against an allowlist.": "使用参数化查询或 ORM。如果必须动态指定表名/列名，请使用白名单校验。",
        "A secret or credential appears to be hardcoded in source code.": "源码中疑似硬编码了密钥或凭据。",
        "Secrets committed to version control are exposed to anyone with repository access and persist in git history.": "提交到版本库的密钥会暴露给有仓库权限的人，并长期留在 git 历史中。",
        "Use environment variables (os.getenv) or a secrets manager (AWS Secrets Manager, HashiCorp Vault).": "使用环境变量（os.getenv）或密钥管理服务（如 AWS Secrets Manager、HashiCorp Vault）。",
        "Shell command execution with user-controlled input may allow command injection.": "用用户可控输入执行 shell 命令可能导致命令注入。",
        "An attacker could inject shell metacharacters (;, |, &&, $()) to execute arbitrary commands.": "攻击者可能注入 shell 元字符（;, |, &&, $()）来执行任意命令。",
        "Avoid shell=True. Use subprocess.run() with a list of arguments instead of a string. Sanitize all user inputs passed to shell commands.": "避免 shell=True。使用参数列表形式的 subprocess.run()，不要拼接命令字符串，并清理所有传给 shell 的用户输入。",
        "eval() and exec() execute arbitrary code and are extremely dangerous with user input.": "eval() 和 exec() 会执行任意代码，和用户输入一起使用非常危险。",
        "An attacker could execute arbitrary Python code on the server via user-controlled input to eval().": "攻击者可能通过传入 eval() 的用户输入在服务器上执行任意 Python 代码。",

    const els = {
      healthDot: document.getElementById("healthDot"),
      healthText: document.getElementById("healthText"),
      repoName: document.getElementById("repoName"),
      sourceType: document.getElementById("sourceType"),
      apiKey: document.getElementById("apiKey"),
      diffText: document.getElementById("diffText"),
      submitBtn: document.getElementById("submitBtn"),
      sampleBtn: document.getElementById("sampleBtn"),
      clearBtn: document.getElementById("clearBtn"),
      message: document.getElementById("message"),
      taskDot: document.getElementById("taskDot"),
      taskStatus: document.getElementById("taskStatus"),
      mergeBanner: document.getElementById("mergeBanner"),
      mergeLabel: document.getElementById("mergeLabel"),
      mergeReason: document.getElementById("mergeReason"),
      totalCount: document.getElementById("totalCount"),
      blockingCount: document.getElementById("blockingCount"),
      highCount: document.getElementById("highCount"),
      testsCount: document.getElementById("testsCount"),
      highRiskList: document.getElementById("highRiskList"),
      severityFilter: document.getElementById("severityFilter"),
      categoryFilter: document.getElementById("categoryFilter"),
      fileFilter: document.getElementById("fileFilter"),
      blockingFilter: document.getElementById("blockingFilter"),
      findingsEmpty: document.getElementById("findingsEmpty"),
      findingsList: document.getElementById("findingsList"),
      markdownReport: document.getElementById("markdownReport"),
      jsonReport: document.getElementById("jsonReport"),
      langButtons: document.querySelectorAll(".lang-btn"),
    };

    function setMessage(text, type = "") {
      els.message.className = `toast ${type}`.trim();
      els.message.textContent = text;
    }

    function setTaskStatus(status) {
      els.taskStatus.textContent = status;
      els.taskDot.className = "dot";
      if (status === "completed") els.taskDot.classList.add("ok");
      if (status === "running" || status === "pending") els.taskDot.classList.add("warn");
      if (status === "failed") els.taskDot.classList.add("bad");
    }

    function stopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    function apiHeaders(includeJson = false) {
      const headers = {};
      if (includeJson) headers["Content-Type"] = "application/json";
      const apiKey = els.apiKey.value.trim();
      if (apiKey) headers["X-API-Key"] = apiKey;
      return headers;
    }

    function saveApiKey() {
      const apiKey = els.apiKey.value.trim();
      if (apiKey) {
        localStorage.setItem("agentReviewApiKey", apiKey);
      } else {
        localStorage.removeItem("agentReviewApiKey");
      }
    }

    function looksLikeGitDiff(text) {
      return /^diff --git a\/.+ b\/.+$/m.test(text) && /^@@ -\d+(?:,\d+)? \+\d+(?:,\d+)? @@/m.test(text);
    }

    function formatApiError(responseText, fallback) {
      try {
        const payload = JSON.parse(responseText);
        const detail = payload.detail;
        if (Array.isArray(detail) && detail.length) {
          return detail.map((item) => item.msg || String(item)).join(" ");
        }
        if (typeof detail === "string") return detail;
      } catch (error) {
        // Keep the original response text below.
      }
      return responseText || fallback;
    }

    async function checkHealth() {
      try {
        const response = await fetch("/health");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        els.healthDot.className = "dot ok";
        els.healthText.textContent = "api online";
      } catch (error) {
        els.healthDot.className = "dot bad";
        els.healthText.textContent = "api offline";
      }
    }

    async function runReview() {
      const diffText = els.diffText.value.trim();
      if (!diffText) {
        setMessage("Please paste or load a diff first.", "error");
        return;
      }
      if (!looksLikeGitDiff(diffText)) {
        setMessage("Please paste a unified Git diff, not plain text. It should include a diff --git header and @@ hunk header.", "error");
        return;
      }

      stopPolling();
      resetResult();
      els.submitBtn.disabled = true;
      setTaskStatus("submitting");
      setMessage("Submitting review task...");

      try {
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: apiHeaders(true),
          body: JSON.stringify({
            source_type: els.sourceType.value.trim() || "ui",
            repo_name: els.repoName.value.trim() || "local-demo",
            diff_text: diffText,
            changed_files: [],
          }),
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(formatApiError(text, `HTTP ${response.status}`));
        }

        const created = await response.json();
        state.taskId = created.task_id;
        setTaskStatus(created.status);
        setMessage(`Task ${state.taskId} created. Polling result...`, "ok");
        state.pollTimer = setInterval(pollTask, 900);
        await pollTask();
      } catch (error) {
        setTaskStatus("failed");
        setMessage(`Submit failed: ${error.message}`, "error");
      } finally {
        els.submitBtn.disabled = false;
      }
    }

    async function pollTask() {
      if (!state.taskId) return;

      try {
        const statusResponse = await fetch(`/api/reviews/${state.taskId}`, {
          headers: apiHeaders(),
        });
        if (!statusResponse.ok) throw new Error(`status HTTP ${statusResponse.status}`);
        const status = await statusResponse.json();
        setTaskStatus(status.status);

        if (status.status === "pending" || status.status === "running") {
          setMessage(`Task ${state.taskId}: ${status.current_stage || status.status}`);
          return;
        }

        stopPolling();

        const reportResponse = await fetch(`/api/reviews/${state.taskId}/report`, {
          headers: apiHeaders(),
        });
        if (!reportResponse.ok) {
          const text = await reportResponse.text();
          throw new Error(text || `report HTTP ${reportResponse.status}`);
        }
        const report = await reportResponse.json();
        renderReport(report);
        setMessage(`Task ${state.taskId} completed.`, "ok");
      } catch (error) {
        stopPolling();
        setTaskStatus("failed");
        setMessage(`Polling failed: ${error.message}`, "error");
      }
    }

    function resetResult() {
      state.latestReport = null;
      state.filters = { severity: "all", category: "all", file: "all", blocking: "all" };
      els.totalCount.textContent = "0";
      els.blockingCount.textContent = "0";
      els.highCount.textContent = "0";
      els.testsCount.textContent = "0";
      els.mergeBanner.className = "merge-banner";
      els.mergeLabel.textContent = "No recommendation yet";
      els.mergeReason.textContent = "Run a review to see the merge guidance.";
      els.highRiskList.innerHTML = "";
      els.severityFilter.value = "all";
      resetSelect(els.categoryFilter, "All categories");
      resetSelect(els.fileFilter, "All files");
      els.blockingFilter.value = "all";
      els.findingsList.innerHTML = "";
      els.findingsEmpty.style.display = "block";
      els.markdownReport.textContent = "No report yet.";
      els.jsonReport.textContent = "No JSON yet.";
    }

    function resetSelect(select, label) {
      select.innerHTML = "";
      const option = document.createElement("option");
      option.value = "all";
      option.textContent = label;
      select.appendChild(option);
      select.value = "all";
    }

    function renderReport(report) {
      state.latestReport = report;
      const json = report.json_report || {};
      const findings = json.findings || [];
      const generatedTests = report.generated_tests || json.generated_tests || [];
      const highOrCritical = findings.filter((f) => f.severity === "high" || f.severity === "critical").length;
      const isZh = state.resultLanguage === "zh";

      els.totalCount.textContent = json.total_findings ?? findings.length;
      els.blockingCount.textContent = json.blocking_count ?? findings.filter((f) => f.blocking).length;
      els.highCount.textContent = highOrCritical;
      els.testsCount.textContent = generatedTests.length;
      els.markdownReport.textContent = isZh ? buildChineseMarkdown(report) : (report.markdown_report || "No Markdown report.");
      els.jsonReport.textContent = JSON.stringify(isZh ? translateReportForDisplay(report) : report, null, 2);

      renderMergeRecommendation(json.merge_recommendation);
      renderHighRiskList(json.high_risk_findings || findings.filter((f) => f.blocking || f.severity === "critical" || f.severity === "high"));
      populateFilters(findings);
      renderFindings(findings);
    }

    function renderMergeRecommendation(recommendation) {
      const rec = recommendation || {
        status: "pass",
        label: "No blocking concerns",
        reason: "No merge recommendation was included in this report.",
      };
      const isZh = state.resultLanguage === "zh";
      els.mergeBanner.className = `merge-banner ${rec.status || "pass"}`;
      els.mergeLabel.textContent = isZh ? translateMergeLabel(rec.status, rec.label) : rec.label;
      els.mergeReason.textContent = isZh ? translateMergeReason(rec.status, rec.reason) : rec.reason;
    }

    function renderHighRiskList(findings) {
      const isZh = state.resultLanguage === "zh";
      els.highRiskList.innerHTML = "";
      for (const finding of findings.slice(0, 3)) {
        const item = document.createElement("div");
        item.className = "risk-item";
        const translated = isZh ? translateFinding(finding) : finding;
        item.innerHTML = `
          <strong>${escapeHtml(translated.title || (isZh ? "未命名问题" : "Untitled finding"))}</strong>
          <span>${escapeHtml(String(finding.severity || "low").toUpperCase())} · <code>${escapeHtml(finding.file_path || "N/A")}:${escapeHtml(String(finding.line_number || "N/A"))}</code></span>
        `;
        els.highRiskList.appendChild(item);
      }
    }

    function populateFilters(findings) {
      const currentCategory = state.filters.category;
      const currentFile = state.filters.file;
      const categories = [...new Set(findings.map((f) => f.category || "uncategorized"))].sort();
      const files = [...new Set(findings.map((f) => f.file_path || "N/A"))].sort();
      fillSelect(els.categoryFilter, "All categories", categories, currentCategory, (value) => state.resultLanguage === "zh" ? translateCategory(value) : value);
      fillSelect(els.fileFilter, "All files", files, currentFile);
    }

    function fillSelect(select, allLabel, values, selectedValue, labeler = (value) => value) {
      select.innerHTML = "";
      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = allLabel;
      select.appendChild(allOption);
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = labeler(value);
        select.appendChild(option);
      }
      select.value = values.includes(selectedValue) ? selectedValue : "all";
      if (select.value === "all") {
        if (select === els.categoryFilter) state.filters.category = "all";
        if (select === els.fileFilter) state.filters.file = "all";
      }
    }

    function filteredFindings(findings) {
      return findings.filter((finding) => {
        const severity = String(finding.severity || "low").toLowerCase();
        const category = finding.category || "uncategorized";
        const file = finding.file_path || "N/A";
        if (state.filters.severity !== "all" && severity !== state.filters.severity) return false;
        if (state.filters.category !== "all" && category !== state.filters.category) return false;
        if (state.filters.file !== "all" && file !== state.filters.file) return false;
        if (state.filters.blocking === "blocking" && !finding.blocking) return false;
        if (state.filters.blocking === "non_blocking" && finding.blocking) return false;
        return true;
      });
    }

    function renderFindings(findings) {
      const visibleFindings = filteredFindings(findings);
      const isZh = state.resultLanguage === "zh";
      els.findingsList.innerHTML = "";
      els.findingsEmpty.style.display = visibleFindings.length ? "none" : "block";
      els.findingsEmpty.textContent = findings.length
        ? (isZh ? "当前筛选条件下没有问题。" : "No findings match the current filters.")
        : (isZh ? "还没有问题。" : "No findings yet.");

      for (const finding of visibleFindings) {
        const item = document.createElement("article");
        item.className = "finding";
        const severity = String(finding.severity || "low").toLowerCase();
        const displayFinding = isZh ? translateFinding(finding) : finding;
        const displaySeverity = isZh ? translateSeverity(severity) : severity;
        const displayCategory = isZh ? translateCategory(finding.category || "uncategorized") : (finding.category || "uncategorized");
        item.innerHTML = `
          <div class="finding-head">
            <h3>${escapeHtml(displayFinding.title || (isZh ? "未命名问题" : "Untitled finding"))}</h3>
            <span class="severity ${escapeHtml(severity)}">${escapeHtml(displaySeverity)}</span>
          </div>
          <div class="meta">
            <code>${escapeHtml(finding.file_path || "N/A")}:${escapeHtml(String(finding.line_number || "N/A"))}</code>
            · ${escapeHtml(displayCategory)}
            · ${isZh ? "置信度" : "confidence"} ${Math.round(Number(finding.confidence || 0) * 100)}%
          </div>
          <p>${escapeHtml(displayFinding.description || "")}</p>
          ${finding.evidence ? `<p><strong>${isZh ? "证据" : "Evidence"}:</strong> <code>${escapeHtml(finding.evidence)}</code></p>` : ""}
          ${displayFinding.attack_scenario ? `<p><strong>${isZh ? "攻击场景" : "Attack Scenario"}:</strong> ${escapeHtml(displayFinding.attack_scenario)}</p>` : ""}
          ${displayFinding.suggestion ? `<p><strong>${isZh ? "建议" : "Suggestion"}:</strong> ${escapeHtml(displayFinding.suggestion)}</p>` : ""}
        `;
        els.findingsList.appendChild(item);
      }
    }

    function translateMergeLabel(status, fallback) {
      const labels = {
        block: "暂不建议合并",
        needs_review: "需要人工复核",
        caution: "谨慎合并",
        pass: "无阻塞风险",
      };
      return labels[String(status || "pass")] || fallback;
    }

    function translateMergeReason(status, fallback) {
      const reasons = {
        block: "请先解决阻塞或严重问题，再继续合并。",
        needs_review: "仍有高危问题，合并前需要人工确认风险。",
        caution: "仍有中危问题，团队接受风险后再合并。",
        pass: "未发现阻塞、严重、高危或中危问题。",
      };
      return reasons[String(status || "pass")] || fallback;
    }

    function translateSeverity(severity) {
      return translations.severity[String(severity || "low").toLowerCase()] || severity;
    }

    function translateCategory(category) {
      return translations.category[String(category || "uncategorized").toLowerCase()] || category;
    }

    function translateText(text) {
      if (!text) return text;
      return translations.title[text] || translations.text[text] || text;
    }

    function translateFinding(finding) {
      return {
        ...finding,
        severity_label: translateSeverity(finding.severity),
        category_label: translateCategory(finding.category),
        title: translateText(finding.title),
        description: translateText(finding.description),
        suggestion: translateText(finding.suggestion),
        attack_scenario: translateText(finding.attack_scenario),
      };
    }

    function translateReportForDisplay(report) {
      const json = report.json_report || {};
      const translatedJson = {
        ...json,
        summary: buildChineseSummary(json),
        merge_recommendation: json.merge_recommendation ? {
          ...json.merge_recommendation,
          label: translateMergeLabel(json.merge_recommendation.status, json.merge_recommendation.label),
          reason: translateMergeReason(json.merge_recommendation.status, json.merge_recommendation.reason),
        } : undefined,
        findings: (json.findings || []).map(translateFinding),
        high_risk_findings: (json.high_risk_findings || []).map(translateFinding),
        test_suggestions: (json.test_suggestions || []).map((item) => ({
          ...item,
          name: translateText(item.name),
          risk_covered: translateText(item.risk_covered),
          test_type_label: translateTestType(item.test_type),
        })),
        validation_result: translateValidation(json.validation_result),
      };
      return {
        ...report,
        summary: translatedJson.summary,
        markdown_report: buildChineseMarkdown(report),
        json_report: translatedJson,
        generated_tests: report.generated_tests || json.generated_tests || [],
      };
    }

    function translateValidation(validation) {
      if (!validation) return validation;
      return {
        ...validation,
        status_label: translateValidationStatus(validation.status),
        errors: validation.errors || [],
        fix_suggestions: (validation.fix_suggestions || []).map(translateText),
      };
    }

    function translateValidationStatus(status) {
      const labels = {
        passed: "通过",
        failed: "失败",
        warning: "有警告",
        not_run: "未运行",
      };
      return labels[String(status || "not_run").toLowerCase()] || status;
    }

    function translateTestType(type) {
      const labels = {
        unit: "单元测试",
        integration: "集成测试",
        security: "安全测试",
        regression: "回归测试",
      };
      return labels[String(type || "unit").toLowerCase()] || type;
    }

    function buildChineseSummary(json) {
      const total = json.total_findings ?? (json.findings || []).length;
      const blocking = json.blocking_count ?? (json.findings || []).filter((f) => f.blocking).length;
      const critical = json.critical_count ?? (json.findings || []).filter((f) => f.severity === "critical").length;
      const high = json.high_count ?? (json.findings || []).filter((f) => f.severity === "high").length;
      const medium = json.medium_count ?? (json.findings || []).filter((f) => f.severity === "medium").length;
      const low = json.low_count ?? (json.findings || []).filter((f) => f.severity === "low").length;
      return `审查完成。共发现 ${total} 个问题：${blocking} 个阻塞，${critical} 个严重，${high} 个高危，${medium} 个中危，${low} 个低危。`;
    }

    function findingMarkdownZh(finding) {
      const translated = translateFinding(finding);
      const severity = translateSeverity(finding.severity || "low");
      const blocking = finding.blocking ? " **[阻塞]**" : "";
      const lines = [
        `### [${severity}]: ${translated.title || "未命名问题"}${blocking}`,
        "",
        `- **类别**: ${translateCategory(finding.category || "uncategorized")}`,
        `- **文件**: \`${finding.file_path || "N/A"}\``,
        `- **行号**: ${finding.line_number || "N/A"}`,
        `- **置信度**: ${Math.round(Number(finding.confidence || 0) * 100)}%`,
        `- **来源**: ${(finding.source_agents || [finding.agent_name || "unknown"]).join(", ")}`,
        "",
        `**描述**: ${translated.description || "N/A"}`,
        "",
      ];
      if (finding.evidence) {
        lines.push(`**证据**: \`${finding.evidence}\``, "");
      }
      if (translated.suggestion) {
        lines.push(`**建议**: ${translated.suggestion}`, "");
      }
      if (translated.attack_scenario) {
        lines.push(`**攻击场景**: ${translated.attack_scenario}`, "");
      }
      return lines.join("\n");
    }

    function buildChineseMarkdown(report) {
      const json = report.json_report || {};
      const findings = json.findings || [];
      const sections = [
        ["阻塞问题", findings.filter((f) => f.blocking)],
        ["严重问题", findings.filter((f) => f.severity === "critical" && !f.blocking)],
        ["高危问题", findings.filter((f) => f.severity === "high" && !f.blocking)],
        ["中危问题", findings.filter((f) => f.severity === "medium")],
        ["低危问题", findings.filter((f) => f.severity === "low")],
      ];
      const recommendation = json.merge_recommendation || {};
      const md = [
        "# 代码审查报告",
        "",
        "## 摘要",
        "",
        buildChineseSummary(json),
        "",
        "## 合并建议",
        "",
        `**${translateMergeLabel(recommendation.status, recommendation.label || "无阻塞风险")}** — ${translateMergeReason(recommendation.status, recommendation.reason || "")}`,
        "",
        "---",
        "",
      ];

      for (const [title, sectionFindings] of sections) {
        if (!sectionFindings.length) continue;
        md.push(`## ${title}`, "");
        sectionFindings.forEach((finding) => md.push(findingMarkdownZh(finding)));
        md.push("---", "");
      }

      if (!findings.length) {
        md.push("未发现问题。", "");
      }

      const testPlan = json.test_suggestions || [];
      const generatedTests = report.generated_tests || json.generated_tests || [];
      if (testPlan.length) {
        md.push("## 测试建议", "");
        testPlan.forEach((item) => {
          md.push(`- **${translateText(item.name || "未命名")}**: ${translateText(item.risk_covered || "")} (${translateTestType(item.test_type || "unit")})`);
        });
        md.push("", "---", "");
      }

      if (generatedTests.length) {
        md.push("## 生成的测试草稿", "");
        generatedTests.forEach((generated) => {
          md.push(`### ${generated.name || "未命名测试"}`, "");
          md.push(`- **目标文件**: \`${generated.target_file || "N/A"}\``);
          md.push(`- **测试框架**: ${generated.framework || "N/A"}`);
          md.push(`- **已执行**: ${generated.executed ? "是" : "否"}`);
          if (generated.code) {
            md.push("", "```python", generated.code.trimEnd(), "```");
          }
          md.push("");
        });
        md.push("---", "");
      }

      if (json.validation_result) {
        md.push("## 验证", "");
        md.push(`- **状态**: ${translateValidationStatus(json.validation_result.status || "not_run")}`);
        const errors = json.validation_result.errors || [];
        if (errors.length) md.push(`- **错误数**: ${errors.length}`);
        md.push("");
      }

      md.push("*由 Agent Review System v0.1 生成*");
      md.push("");
      return md.join("\n");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
      });
    });

    function setResultLanguage(language) {
      state.resultLanguage = language;
      els.langButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === language);
      });
      if (state.latestReport) {
        renderReport(state.latestReport);
      }
    }

    function updateFilter(key, value) {
      state.filters[key] = value;
      if (state.latestReport) {
        renderReport(state.latestReport);
      }
    }

    els.langButtons.forEach((button) => {
      button.addEventListener("click", () => setResultLanguage(button.dataset.lang));
    });
    els.severityFilter.addEventListener("change", () => updateFilter("severity", els.severityFilter.value));
    els.categoryFilter.addEventListener("change", () => updateFilter("category", els.categoryFilter.value));
    els.fileFilter.addEventListener("change", () => updateFilter("file", els.fileFilter.value));
    els.blockingFilter.addEventListener("change", () => updateFilter("blocking", els.blockingFilter.value));
    els.apiKey.addEventListener("change", saveApiKey);

    els.submitBtn.addEventListener("click", runReview);
    els.sampleBtn.addEventListener("click", () => {
      els.diffText.value = sampleDiff;
      setMessage("Sample diff loaded.", "ok");
    });
    els.clearBtn.addEventListener("click", () => {
      stopPolling();
      els.diffText.value = "";
      state.taskId = null;
      setTaskStatus("idle");
      resetResult();
      setMessage("Ready.");
    });

    els.apiKey.value = localStorage.getItem("agentReviewApiKey") || "";
    els.diffText.value = sampleDiff;
    checkHealth();
  </script>
</body>
</html>
